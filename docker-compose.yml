# Runs the official Qdrant vector database locally.
# Data is persisted in a local ./qdrant_storage folder so it survives restarts.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: qdrant_space_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 12
