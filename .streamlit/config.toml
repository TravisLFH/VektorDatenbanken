[server]
# App-Code wird automatisch neu geladen; grosse Laufzeitdaten bleiben ungeachtet.
fileWatcherType = "auto"
folderWatchBlacklist = [".venv", "qdrant_storage", ".git", ".pytest_cache", "__pycache__"]

[theme]
primaryColor = "#0f766e"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f3"
textColor = "#24313a"
font = "sans serif"
